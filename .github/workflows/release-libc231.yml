name: Release libc2.31

# 目标：产物最低要求 glibc 2.31，在 AlmaLinux 9.3（glibc 2.34）可运行。
# 用 cargo-zigbuild 的 glibc 版本后缀目标，产出「glibc 最低 2.31」的动态链接二进制。
on:
  push:
    tags:
      - 'libc231-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Zig
        run: |
          curl -fL -o /tmp/zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install build deps (cmake + clang for wreq/BoringSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev perl binutils

      - name: Configure libclang
        shell: bash
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      - name: Build no-render
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 -p obscura-cli --bins --no-default-features

      - name: Stage no-render
        run: |
          BIN_DIR=$(ls -d target/x86_64-unknown-linux-gnu*/release | head -1)
          [ -n "$BIN_DIR" ] || { echo "no target dir"; exit 1; }
          mkdir -p dist/no-render && cp "$BIN_DIR"/obscura* dist/no-render/

      - name: Build no-render-stealth
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 -p obscura-cli --bins --no-default-features --features stealth

      - name: Stage no-render-stealth
        run: |
          BIN_DIR=$(ls -d target/x86_64-unknown-linux-gnu*/release | head -1)
          [ -n "$BIN_DIR" ] || { echo "no target dir"; exit 1; }
          mkdir -p dist/no-render-stealth && cp "$BIN_DIR"/obscura* dist/no-render-stealth/

      - name: Build default (render)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 -p obscura-cli --bins --features render

      - name: Stage default
        run: |
          BIN_DIR=$(ls -d target/x86_64-unknown-linux-gnu*/release | head -1)
          [ -n "$BIN_DIR" ] || { echo "no target dir"; exit 1; }
          mkdir -p dist/default && cp "$BIN_DIR"/obscura* dist/default/

      - name: Build stealth (render+stealth)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.31 -p obscura-cli --bins --features render,stealth

      - name: Stage stealth
        run: |
          BIN_DIR=$(ls -d target/x86_64-unknown-linux-gnu*/release | head -1)
          [ -n "$BIN_DIR" ] || { echo "no target dir"; exit 1; }
          mkdir -p dist/stealth && cp "$BIN_DIR"/obscura* dist/stealth/

      - name: Smoke test
        # 每个变体跑一次 V8 路径，防止发布带快照崩溃的二进制（issue #290）
        shell: bash
        run: |
          for VARIANT in default stealth no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          done
          for VARIANT in default stealth; do
            BIN=dist/$VARIANT/obscura
            "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
            test -s smoke.png && rm smoke.png
          done
          for VARIANT in no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            if "$BIN" fetch "data:text/html,<title>no-render</title>" --screenshot smoke.png; then
              echo "$VARIANT unexpectedly supports screenshots" >&2
              exit 1
            fi
            test ! -e smoke.png
          done

      - name: Verify max glibc requirement (must be <= 2.31)
        shell: bash
        run: |
          for VARIANT in default stealth no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "$VARIANT: max GLIBC symbol version = $MAX"
            case "$MAX" in
              GLIBC_2.0|GLIBC_2.1*|GLIBC_2.2*|GLIBC_2.30|GLIBC_2.31) ;;
              *) echo "ERROR: $VARIANT requires $MAX (need <= GLIBC_2.31)" >&2; exit 1 ;;
            esac
          done

      - name: Package
        run: |
          tar czf obscura-x86_64-linux-glibc2.31.tar.gz -C dist/default obscura obscura-worker
          tar czf obscura-x86_64-linux-glibc2.31-stealth.tar.gz -C dist/stealth obscura obscura-worker
          tar czf obscura-x86_64-linux-glibc2.31-no-render.tar.gz -C dist/no-render obscura obscura-worker
          tar czf obscura-x86_64-linux-glibc2.31-no-render-stealth.tar.gz -C dist/no-render-stealth obscura obscura-worker

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: obscura-x86_64-linux-glibc2.31*.tar.gz
          body: |
            专为 AlmaLinux 9.3（glibc 2.34）构建，最低要求 glibc 2.31。修复 upstream 0.2.2（glibc 2.35，AlmaLinux 9.3 报 `GLIBC_2.35 not found`）不兼容问题。

            基于 v0.2.2 源码 + cargo-zigbuild 目标 `x86_64-unknown-linux-gnu.2.31`。按需下载对应变体（均含 obscura + obscura-worker）：
            - **stealth**：render + stealth（含渲染，推荐，与官方 -stealth 对应）
            - **default**：仅 render
            - **no-render-stealth**：stealth 无渲染
            - **no-render**：最精简

            使用：解压后 `obscura` 与 `obscura-worker` 放入容器 `/usr/local/bin/`。
